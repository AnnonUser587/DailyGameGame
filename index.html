<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Dash</title>
<meta name="description" content="All your daily games in one place. Tap to play, or roll a random one you haven't played today.">
<meta name="theme-color" content="#0f0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Dash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#17171c; --muted:#6d6b74; --line:#e5e2da;
  --accent:#ff5a36; --accent2:#7c5cff; --good:#1fa971; --star:#f5b301;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
  --radius:18px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f0f14;--card:#1a1a22;--ink:#f2f1f6;--muted:#9a98a6;--line:#2a2a35;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
:root[data-theme="light"]{--bg:#f6f4ef;--card:#fff;--ink:#17171c;--muted:#6d6b74;--line:#e5e2da;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06)}
:root[data-theme="dark"]{--bg:#0f0f14;--card:#1a1a22;--ink:#f2f1f6;--muted:#9a98a6;--line:#2a2a35;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100dvh;padding-bottom:calc(110px + var(--safe-bot))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* Header */
header{padding:calc(14px + var(--safe-top)) 0 6px}
.top{display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:28px;letter-spacing:-.03em;flex:1;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:16px 0 0 var(--accent2);margin-right:16px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px}
.iconbtn:active{transform:scale(.94)}

.stats{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:14px;background:var(--card);
  border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:--p .6s}
.ring>div{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:14px}
.statline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.statline b{color:var(--ink)}
.today{font-weight:700;font-size:17px;margin-bottom:2px}

/* Random */
.randomBtn{margin-top:14px;width:100%;padding:18px;border-radius:var(--radius);font-weight:800;font-size:19px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 28px rgba(124,92,255,.35);
  display:flex;align-items:center;justify-content:center;gap:10px}
.randomBtn:active{transform:scale(.98)}
.randomBtn:disabled{opacity:.55;box-shadow:none}
.randomBtn .die{display:inline-block;font-size:24px}
.randomBtn:not(:disabled):hover .die{animation:wob .5s}
@keyframes wob{50%{transform:rotate(25deg) scale(1.15)}}

/* Toolbar */
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;margin-top:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg)}

/* Grid */
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 2px 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  transition:transform .15s,opacity .2s}
.card:active{transform:scale(.97)}
.card a.play{display:flex;flex-direction:column;gap:8px;padding:14px 14px 12px;text-decoration:none;min-height:122px}
.card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;position:relative;overflow:hidden}
.card .ico img{width:28px;height:28px;position:absolute;inset:0;margin:auto;border-radius:6px;background:#fff}
.card .name{font-weight:750;font-size:16px;line-height:1.2;word-break:break-word}
.card .host{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .acts{position:absolute;top:8px;right:6px;display:flex;gap:2px}
.card .acts button{width:32px;height:32px;border-radius:10px;font-size:16px;display:grid;place-items:center;color:var(--muted)}
.card .acts button:active{background:var(--line)}
.card .acts .fav.on{color:var(--star)}
.card.done{opacity:.55}
.card.done .ico::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;background:rgba(31,169,113,.92);color:#fff;font-weight:900;font-size:22px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--muted);align-self:flex-start}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-bot));width:60px;height:60px;border-radius:20px;background:var(--ink);color:var(--bg);
  font-size:32px;font-weight:300;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:20}
.fab:active{transform:scale(.93)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px 18px calc(20px + var(--safe-bot));max-height:88dvh;overflow:auto;transform:translateY(105%);
  transition:transform .32s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
@media (min-width:700px){.sheet{bottom:50%;border-radius:24px;transform:translateY(60%) scale(.96);opacity:0;transition:.25s}
  .sheet.on{transform:translateY(50%);opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 14px;font-size:22px;letter-spacing:-.02em}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.in{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;outline:none}
.in:focus{border-color:var(--accent2)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{width:100%;padding:15px;border-radius:14px;font-weight:750;font-size:16px;background:var(--line);margin-top:10px;text-align:center;text-decoration:none;display:block}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.grad{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.danger{color:#e5484d}
.btn:active{transform:scale(.98)}
.note{font-size:13px;color:var(--muted);margin:8px 0}
.list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.list button,.list a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%;text-decoration:none}
.list button:last-child{border-bottom:0}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;border-radius:10px;font-size:22px;background:var(--bg)}
.emojis button.on{outline:2px solid var(--accent2)}

/* Random reveal */
.slot{height:110px;display:grid;place-items:center;text-align:center;margin:6px 0 4px}
.slot .big{font-size:52px;line-height:1}
.slot .nm{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.slot.spin .big,.slot.spin .nm{animation:flick .09s linear infinite}
@keyframes flick{50%{opacity:.4;transform:translateY(-3px)}}
.slot.land{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bot));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-weight:650;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.install{display:none;margin-top:12px;background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);font-size:14px;align-items:center;gap:10px}
.install.on{display:flex}
.install span{flex:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header>
    <div class="top">
      <div class="brand"><span class="dot"></span>Daily Dash</div>
      <button class="iconbtn" id="menuBtn" aria-label="Menu">⚙︎</button>
    </div>

    <div class="stats">
      <div class="ring" id="ring"><div id="ringTxt">0/0</div></div>
      <div>
        <div class="today" id="todayTxt">Today</div>
        <div class="statline">
          <span>🔥 <b id="streak">0</b> day streak</span>
          <span>⏳ resets in <b id="countdown">--</b></span>
        </div>
      </div>
    </div>

    <div class="install" id="installTip">
      <span>📲 Add to your Home Screen: tap <b>Share</b> → <b>Add to Home Screen</b>.</span>
      <button class="iconbtn" id="installClose" style="width:32px;height:32px;box-shadow:none">✕</button>
    </div>

    <button class="randomBtn" id="randomBtn"><span class="die">🎲</span><span id="randomLbl">Random game</span></button>
  </header>

  <div class="toolbar">
    <div class="search">🔎<input id="q" type="search" placeholder="Search games" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="main"></main>
</div>

<button class="fab" id="fab" aria-label="Add game">+</button>

<div class="scrim" id="scrim"></div>

<!-- Random sheet -->
<div class="sheet" id="sheetRandom" role="dialog" aria-label="Random game">
  <div class="grab"></div>
  <div class="slot" id="slot"><div><div class="big" id="slotEmoji">🎲</div><div class="nm" id="slotName">…</div></div></div>
  <div class="note" id="slotNote" style="text-align:center"></div>
  <a class="btn grad" id="slotPlay" target="_blank" rel="noopener">Play ▶︎</a>
  <div class="row">
    <button class="btn" id="slotReroll">🔄 Reroll</button>
    <button class="btn" id="slotSkip" title="Mark as done without playing">⏭ Skip today</button>
  </div>
  <label class="note" style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px">
    <input type="checkbox" id="favOnly"> Only roll from favorites
  </label>
</div>

<!-- Add / edit sheet -->
<div class="sheet" id="sheetEdit" role="dialog" aria-label="Add game">
  <div class="grab"></div>
  <h3 id="editTitle">Add a daily game</h3>
  <form id="editForm" autocomplete="off">
    <label class="f" for="fUrl">Link</label>
    <input class="in" id="fUrl" type="url" inputmode="url" placeholder="https://example.com" required autocapitalize="off">
    <label class="f" for="fName">Name</label>
    <input class="in" id="fName" placeholder="Auto-filled from link" maxlength="40">
    <label class="f" for="fTag">Category</label>
    <select class="in" id="fTag"></select>
    <label class="f">Icon</label>
    <div class="emojis" id="emojiPick"></div>
    <button class="btn pri" type="submit" id="saveBtn">Save game</button>
  </form>
  <button class="btn danger hidden" id="delBtn">Delete game</button>
  <button class="btn" data-close>Cancel</button>
</div>

<!-- Game options sheet -->
<div class="sheet" id="sheetGame" role="dialog" aria-label="Game options">
  <div class="grab"></div>
  <h3 id="gTitle">Game</h3>
  <div class="note" id="gUrl" style="word-break:break-all"></div>
  <div class="list">
    <button id="gPlayed">✅ <span>Mark as played today</span></button>
    <button id="gFav">⭐ <span>Add to favorites</span></button>
    <button id="gShare">📤 <span>Share link</span></button>
    <button id="gEdit">✏️ <span>Edit</span></button>
    <button id="gHide">🙈 <span>Hide game</span></button>
  </div>
  <button class="btn" data-close>Close</button>
</div>

<!-- Menu sheet -->
<div class="sheet" id="sheetMenu" role="dialog" aria-label="Settings">
  <div class="grab"></div>
  <h3>Settings</h3>
  <div class="list">
    <button id="mTheme">🌗 <span>Theme: <b id="themeLbl">Auto</b></span></button>
    <button id="mDoneLast">↕️ <span>Move played games to bottom: <b id="doneLastLbl">On</b></span></button>
    <button id="mReset">🔁 <span>Reset today's progress</span></button>
    <button id="mHidden">👀 <span>Show hidden games (<b id="hiddenCount">0</b>)</span></button>
    <button id="mShareList">🔗 <span>Share my custom games as a link</span></button>
    <button id="mExport">💾 <span>Export backup (JSON)</span></button>
    <button id="mImport">📥 <span>Import backup</span></button>
    <button id="mInstall">📲 <span>How to install on iPhone</span></button>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  <p class="note">Everything is saved on this device only. Daily progress resets at midnight your local time.</p>
  <button class="btn" data-close>Close</button>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

/* ---------- Built-in games ---------- */
const BUILTIN = [
  {id:"wordle",   name:"Wordle",          url:"https://www.nytimes.com/games/wordle/index.html", emoji:"🟩", tag:"Words"},
  {id:"costcodle",name:"Costcodle",       url:"https://costcodle.com/",                          emoji:"🛒", tag:"Guessing"},
  {id:"sweardle", name:"Sweardle",        url:"https://sweardle.com/",                           emoji:"🤬", tag:"Words"},
  {id:"urbanstats",name:"Urban Stats Quiz",url:"https://urbanstats.org/quiz.html",               emoji:"🏙️", tag:"Geography"},
  {id:"kindahardgolf",name:"Kinda Hard Golf",url:"https://kindahardgolf.com/",                   emoji:"⛳", tag:"Puzzle"},
  {id:"amountle", name:"Amountle",        url:"https://www.amountle.dev/",                       emoji:"🔢", tag:"Numbers"},
  {id:"dialedcolor2",name:"Dialed Color 2",url:"https://dialed.gg/color2",                       emoji:"🎨", tag:"Skill"},
  {id:"dialedcolor",name:"Dialed Color",  url:"https://dialed.gg/color",                         emoji:"🖌️", tag:"Skill"},
  {id:"dialedtime",name:"Dialed Time",    url:"https://dialed.gg/time",                          emoji:"⏱️", tag:"Skill"},
  {id:"jigsy",    name:"Jigsy",           url:"https://jigsy.app/daily/",                        emoji:"🧩", tag:"Puzzle"},
  {id:"zip",      name:"Zip",             url:"https://www.zipgameunlimited.com/",               emoji:"⚡", tag:"Puzzle"},
  {id:"coindle",  name:"Coindle",         url:"https://coindle.muhashi.com/",                    emoji:"🪙", tag:"Guessing"},
  {id:"timingle", name:"Timingle",        url:"https://timingle.com/",                           emoji:"⏰", tag:"Skill"},
  {id:"atlas",    name:"Atlas Daily",     url:"https://atlasdaily.day/",                         emoji:"🗺️", tag:"Geography"},
  {id:"forgeous", name:"Forgeous",        url:"https://forgeous.fun",                            emoji:"⚒️", tag:"Puzzle"},
  {id:"dailytens",name:"Daily Tens",      url:"https://dailytens.com/",                          emoji:"🔟", tag:"Numbers"},
  {id:"fermi",    name:"Fermi",           url:"https://fermi.gg/",                               emoji:"🧮", tag:"Numbers"},
  {id:"halfsies", name:"Halfsies",        url:"https://halfsies.dev/",                           emoji:"🌗", tag:"Guessing"},
];
const TAGS = ["Words","Puzzle","Numbers","Geography","Guessing","Skill","Trivia","Other"];
const EMOJIS = ["🎮","🟩","🧩","🔢","🗺️","🎨","⏱️","🧠","🎯","🏆","🔤","🌍","🎲","💡","🃏","🎵","🎬","⚽","🐶","🍔","💰","⭐","🔥","❓"];
const TINTS = ["#ffe3d9","#e4ddff","#d8f3e7","#fff1c7","#dbeeff","#ffdcec","#e9f5d0","#f0e3d6"];

/* ---------- Storage (safe) ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("dd_"+k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("dd_"+k, JSON.stringify(v)); }catch{} }
};
const todayKey = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

let S = {
  custom: LS.get("custom", []),        // [{id,name,url,emoji,tag,custom:true}]
  edits:  LS.get("edits", {}),         // overrides for builtins {id:{name,emoji,tag,url}}
  hidden: LS.get("hidden", []),
  favs:   LS.get("favs", []),
  played: LS.get("played", {date:todayKey(), ids:[]}),
  history:LS.get("history", {}),       // {date: count}
  theme:  LS.get("theme", "auto"),
  doneLast: LS.get("doneLast", true),
  favOnly: LS.get("favOnly", false),
  showHidden:false,
  filter:"All", q:"",
};
const save = () => { ["custom","edits","hidden","favs","played","history","theme","doneLast","favOnly"].forEach(k=>LS.set(k,S[k])); };

function rollDay(){
  const t = todayKey();
  if (S.played.date !== t){ S.played = {date:t, ids:[]}; save(); render(); }
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,""); }catch{ return u; } };
const safeUrl = u => { try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; }catch{ return null; } };
const tint = id => { let h=0; for (const c of id) h=(h*31+c.charCodeAt(0))>>>0; return TINTS[h%TINTS.length]; };
const nameFromUrl = u => {
  const h = hostOf(u).split(".")[0] || "Game";
  return h.replace(/[-_]+/g," ").replace(/\b\w/g, c=>c.toUpperCase());
};

function allGames(includeHidden){
  const b = BUILTIN.map(g => ({...g, ...(S.edits[g.id]||{}), builtin:true}));
  const list = [...b, ...S.custom];
  return includeHidden ? list : list.filter(g => !S.hidden.includes(g.id));
}
const getGame = id => allGames(true).find(g => g.id === id);
const isPlayed = id => S.played.ids.includes(id);

function markPlayed(id, on=true){
  rollDay();
  const was = isPlayed(id);
  if (on && !was) S.played.ids.push(id);
  if (!on && was) S.played.ids = S.played.ids.filter(x => x!==id);
  S.history[S.played.date] = S.played.ids.length;
  if (!S.history[S.played.date]) delete S.history[S.played.date];
  save(); render();
  const vis = allGames();
  if (on && !was && vis.length && vis.every(g => isPlayed(g.id))) { confetti(); toast("🏆 Every game done today!"); }
}

function streak(){
  let n = 0; const d = new Date();
  const key = x => x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if (!S.history[key(d)]) d.setDate(d.getDate()-1); // today not started yet doesn't break streak
  while (S.history[key(d)]) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- Render ---------- */
function cardHTML(g){
  const played = isPlayed(g.id), fav = S.favs.includes(g.id), hidden = S.hidden.includes(g.id);
  return `<div class="card ${played?"done":""}" data-id="${esc(g.id)}" ${hidden?'style="outline:2px dashed var(--muted)"':""}>
    <a class="play" href="${esc(g.url)}" target="_blank" rel="noopener" data-play="${esc(g.id)}">
      <div class="ico" style="background:${tint(g.id)}">${esc(g.emoji||"🎮")}</div>
      <div class="name">${esc(g.name)}</div>
      <div class="host">${esc(hostOf(g.url))}</div>
      ${g.custom?'<span class="badge">Yours</span>':""}
    </a>
    <div class="acts">
      <button class="fav ${fav?"on":""}" data-fav="${esc(g.id)}" aria-label="Favorite">${fav?"★":"☆"}</button>
      <button data-more="${esc(g.id)}" aria-label="More">⋯</button>
    </div>
  </div>`;
}

function render(){
  const games = allGames(S.showHidden);
  const visible = allGames();
  const done = visible.filter(g => isPlayed(g.id)).length;

  // stats
  const pct = visible.length ? Math.round(done/visible.length*100) : 0;
  $("#ring").style.setProperty("--p", pct);
  $("#ringTxt").textContent = `${done}/${visible.length}`;
  $("#todayTxt").textContent = done===0 ? "Let's play 👋" : done===visible.length ? "All done today! 🎉" : `${visible.length-done} left today`;
  $("#streak").textContent = streak();
  $("#hiddenCount").textContent = S.hidden.length;

  // random button
  const pool = randomPool();
  $("#randomBtn").disabled = pool.length===0;
  $("#randomLbl").textContent = pool.length ? `Random game · ${pool.length} left` : "All played — come back tomorrow";

  // chips
  const tagsInUse = TAGS.filter(t => games.some(g => g.tag===t));
  const chips = ["All","Unplayed","Played","★ Favorites",...tagsInUse];
  if (!chips.includes(S.filter)) S.filter = "All";
  $("#chips").innerHTML = chips.map(c => `<button class="chip ${c===S.filter?"on":""}" data-chip="${esc(c)}">${esc(c)}</button>`).join("");

  // filter
  const q = S.q.trim().toLowerCase();
  let list = games.filter(g => {
    if (q && !(g.name.toLowerCase().includes(q) || g.url.toLowerCase().includes(q) || (g.tag||"").toLowerCase().includes(q))) return false;
    switch (S.filter){
      case "All": return true;
      case "Unplayed": return !isPlayed(g.id);
      case "Played": return isPlayed(g.id);
      case "★ Favorites": return S.favs.includes(g.id);
      default: return g.tag===S.filter;
    }
  });

  const favFirst = (a,b) => (S.favs.includes(b.id)) - (S.favs.includes(a.id));
  list.sort(favFirst);

  let html = "";
  if (!list.length){
    html = `<div class="empty">${q ? "No games match “"+esc(S.q)+"”." : "Nothing here yet."}<br><br><button class="btn pri" id="emptyAdd" style="max-width:240px;margin:0 auto">+ Add a game</button></div>`;
  } else if (S.doneLast && S.filter==="All"){
    const todo = list.filter(g=>!isPlayed(g.id)), dn = list.filter(g=>isPlayed(g.id));
    if (todo.length) html += `<h2 class="sec">To play</h2><div class="grid">${todo.map(cardHTML).join("")}</div>`;
    if (dn.length) html += `<h2 class="sec">Done today ✓</h2><div class="grid">${dn.map(cardHTML).join("")}</div>`;
  } else {
    html = `<div class="grid" style="margin-top:14px">${list.map(cardHTML).join("")}</div>`;
  }
  $("#main").innerHTML = html;
}

/* ---------- Random ---------- */
let rolled = null, rerolledAway = [];
function randomPool(){
  return allGames().filter(g => !isPlayed(g.id) && (!S.favOnly || S.favs.includes(g.id)));
}
function rollRandom(){
  rollDay();
  let pool = randomPool();
  if (!pool.length){ closeSheets(); toast(S.favOnly ? "No unplayed favorites left" : "You've played everything today 🎉"); return; }
  // avoid showing the ones you just rerolled past, until there's nothing else
  let fresh = pool.filter(g => !rerolledAway.includes(g.id));
  if (!fresh.length){ rerolledAway = []; fresh = pool; }
  if (fresh.length > 1 && rolled) fresh = fresh.filter(g => g.id !== rolled.id);
  const pick = fresh[crypto.getRandomValues(new Uint32Array(1))[0] % fresh.length];

  const slot = $("#slot"), play = $("#slotPlay");
  play.classList.add("hidden");
  slot.classList.remove("land"); slot.classList.add("spin");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0, steps = reduce ? 0 : 14;
  const tick = () => {
    if (i < steps){
      const g = pool[Math.floor(Math.random()*pool.length)];
      $("#slotEmoji").textContent = g.emoji||"🎮"; $("#slotName").textContent = g.name;
      i++; setTimeout(tick, 30 + i*i*0.8);
    } else {
      rolled = pick;
      $("#slotEmoji").textContent = pick.emoji||"🎮"; $("#slotName").textContent = pick.name;
      slot.classList.remove("spin"); void slot.offsetWidth; slot.classList.add("land");
      play.href = pick.url; play.dataset.play = pick.id; play.classList.remove("hidden");
      $("#slotNote").textContent = `${hostOf(pick.url)} · ${pool.length-1} more after this`;
    }
  };
  tick();
}

/* ---------- Sheets ---------- */
function openSheet(id){ closeSheets(true); $("#scrim").classList.add("on"); $(id).classList.add("on"); }
function closeSheets(keepScrim){
  document.querySelectorAll(".sheet.on").forEach(s => s.classList.remove("on"));
  if (!keepScrim) $("#scrim").classList.remove("on");
}

let editing = null, pickedEmoji = "🎮";
function openEdit(g, prefill){
  editing = g ? g.id : null;
  $("#editTitle").textContent = g ? "Edit game" : "Add a daily game";
  $("#fUrl").value = g ? g.url : (prefill?.url || "");
  $("#fName").value = g ? g.name : (prefill?.name || "");
  $("#fTag").innerHTML = TAGS.map(t => `<option ${((g?.tag)||"Other")===t?"selected":""}>${t}</option>`).join("");
  pickedEmoji = g?.emoji || "🎮";
  $("#emojiPick").innerHTML = EMOJIS.map(e => `<button type="button" class="${e===pickedEmoji?"on":""}" data-emoji="${e}">${e}</button>`).join("");
  $("#delBtn").classList.toggle("hidden", !(g && g.custom));
  openSheet("#sheetEdit");
  if (!g) setTimeout(()=>$("#fUrl").focus(), 350);
}

let current = null;
function openGame(id){
  const g = getGame(id); if (!g) return; current = g;
  $("#gTitle").textContent = `${g.emoji||"🎮"} ${g.name}`;
  $("#gUrl").textContent = g.url;
  $("#gPlayed span").textContent = isPlayed(id) ? "Mark as not played" : "Mark as played today";
  $("#gFav span").textContent = S.favs.includes(id) ? "Remove from favorites" : "Add to favorites";
  $("#gHide span").textContent = S.hidden.includes(id) ? "Unhide game" : "Hide game";
  openSheet("#sheetGame");
}

/* ---------- Toast & confetti ---------- */
let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2200); }

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d"), dpr = devicePixelRatio||1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; x.scale(dpr,dpr);
  const cols = ["#ff5a36","#7c5cff","#1fa971","#f5b301","#2ea8ff"];
  const P = Array.from({length:140}, () => ({x:innerWidth/2, y:innerHeight/3, vx:(Math.random()-.5)*14, vy:Math.random()*-14-4,
    r:Math.random()*6+4, c:cols[Math.random()*cols.length|0], a:Math.random()*6, s:(Math.random()-.5)*.3}));
  let f = 0;
  (function loop(){
    x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p => { p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.s;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if (++f < 160) requestAnimationFrame(loop); else x.clearRect(0,0,innerWidth,innerHeight);
  })();
}

/* ---------- Theme ---------- */
function applyTheme(){
  if (S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
  $("#themeLbl").textContent = {auto:"Auto",light:"Light",dark:"Dark"}[S.theme];
  $("#doneLastLbl").textContent = S.doneLast ? "On" : "Off";
}

/* ---------- Countdown ---------- */
function tickClock(){
  rollDay();
  const n = new Date(), m = new Date(n); m.setHours(24,0,0,0);
  const s = Math.max(0, Math.floor((m-n)/1000));
  const h = Math.floor(s/3600), mi = Math.floor(s%3600/60);
  $("#countdown").textContent = h ? `${h}h ${mi}m` : `${mi}m ${s%60}s`;
}

/* ---------- Share / import ---------- */
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
const baseUrl = () => location.href.split(/[?#]/)[0];

async function shareText(title, url){
  if (navigator.share){ try{ await navigator.share({title, url}); return; }catch(e){ if (e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(url); toast("Link copied 📋"); }catch{ prompt("Copy this link:", url); }
}

function addCustom(list){
  let added = 0;
  const known = new Set(allGames(true).map(g => g.url.replace(/\/+$/,"").toLowerCase()));
  for (const g of list){
    const url = safeUrl(g.url); if (!url) continue;
    const k = url.replace(/\/+$/,"").toLowerCase(); if (known.has(k)) continue; known.add(k);
    S.custom.push({id:"c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:String(g.name||nameFromUrl(url)).slice(0,40),
      url, emoji:EMOJIS.includes(g.emoji)?g.emoji:(g.emoji?String(g.emoji).slice(0,4):"🎮"), tag:TAGS.includes(g.tag)?g.tag:"Other", custom:true});
    added++;
  }
  save(); render(); return added;
}

function handleUrlParams(){
  const p = new URLSearchParams(location.search);
  let changed = false;
  if (p.get("import")){
    try{ const list = b64d(p.get("import"));
      if (Array.isArray(list) && confirm(`Add ${list.length} game(s) from this shared link?`)){
        const n = addCustom(list); toast(n ? `Added ${n} game${n>1?"s":""} 🎉` : "You already have those games");
      }}catch{ toast("That share link looks broken"); }
    changed = true;
  }
  if (p.get("add")){ setTimeout(()=>openEdit(null, {url:p.get("add"), name:p.get("name")||""}), 300); changed = true; }
  if (p.has("random")){ setTimeout(()=>{ openSheet("#sheetRandom"); rollRandom(); }, 300); changed = true; }
  if (changed) history.replaceState(null, "", baseUrl());
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-play],[data-fav],[data-more],[data-chip],[data-close],[data-emoji],#emptyAdd");
  if (!t) return;
  if (t.dataset.play){ // let the link open, then mark played
    const id = t.dataset.play;
    setTimeout(() => { markPlayed(id, true); if (t.id==="slotPlay") closeSheets(); }, 60);
    rerolledAway = [];
    return;
  }
  e.preventDefault();
  if (t.dataset.fav){ const id=t.dataset.fav; S.favs = S.favs.includes(id) ? S.favs.filter(x=>x!==id) : [...S.favs,id]; save(); render(); }
  else if (t.dataset.more) openGame(t.dataset.more);
  else if (t.dataset.chip){ S.filter = t.dataset.chip; render(); }
  else if (t.hasAttribute("data-close")) closeSheets();
  else if (t.dataset.emoji){ pickedEmoji = t.dataset.emoji; document.querySelectorAll("#emojiPick button").forEach(b=>b.classList.toggle("on", b===t)); }
  else if (t.id==="emptyAdd") openEdit(null);
});

$("#scrim").onclick = () => closeSheets();
document.addEventListener("keydown", e => {
  if (e.key==="Escape") closeSheets();
  if (e.target.matches("input,select,textarea")) return;
  if (e.key==="r" && !$(".sheet.on")){ e.preventDefault(); $("#randomBtn").click(); }
  if (e.key==="/"){ e.preventDefault(); $("#q").focus(); }
});

// swipe-down to dismiss sheets
document.querySelectorAll(".sheet").forEach(sh => {
  let y0=null, dy=0;
  sh.addEventListener("touchstart", e => { if (sh.scrollTop<=0) { y0=e.touches[0].clientY; dy=0; sh.style.transition="none"; } }, {passive:true});
  sh.addEventListener("touchmove", e => { if (y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); if (innerWidth<700) sh.style.transform=`translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener("touchend", () => { if (y0==null) return; sh.style.transition=""; sh.style.transform=""; if (dy>110) closeSheets(); y0=null; });
});

$("#q").addEventListener("input", e => { S.q = e.target.value; render(); });
$("#fab").onclick = () => openEdit(null);
$("#menuBtn").onclick = () => openSheet("#sheetMenu");
$("#randomBtn").onclick = () => { rolled=null; rerolledAway=[]; $("#favOnly").checked = S.favOnly; openSheet("#sheetRandom"); rollRandom(); };
$("#slotReroll").onclick = () => { if (rolled) rerolledAway.push(rolled.id); rollRandom(); };
$("#slotSkip").onclick = () => { if (rolled){ markPlayed(rolled.id, true); toast(`Skipped ${rolled.name} for today`); rolled=null; } rollRandom(); };
$("#favOnly").onchange = e => { S.favOnly = e.target.checked; save(); render(); rolled=null; rollRandom(); };

$("#fUrl").addEventListener("blur", () => {
  let v = $("#fUrl").value.trim();
  if (v && !/^https?:\/\//i.test(v)) { v = "https://"+v; $("#fUrl").value = v; }
  if (v && !$("#fName").value.trim() && safeUrl(v)) $("#fName").value = nameFromUrl(v);
});
$("#editForm").onsubmit = e => {
  e.preventDefault();
  let raw = $("#fUrl").value.trim(); if (raw && !/^https?:\/\//i.test(raw)) raw = "https://"+raw;
  const url = safeUrl(raw); if (!url){ toast("That link doesn't look right"); return; }
  const name = ($("#fName").value.trim() || nameFromUrl(url)).slice(0,40);
  const tag = $("#fTag").value;
  if (editing){
    const g = getGame(editing);
    if (g.custom) Object.assign(S.custom.find(c=>c.id===editing), {name,url,tag,emoji:pickedEmoji});
    else S.edits[editing] = {name,url,tag,emoji:pickedEmoji};
    save(); render(); toast("Saved ✓");
  } else {
    const n = addCustom([{name,url,tag,emoji:pickedEmoji}]);
    toast(n ? `Added ${name} 🎉` : "You already have that game");
  }
  closeSheets();
};
$("#delBtn").onclick = () => {
  if (!editing || !confirm("Delete this game?")) return;
  S.custom = S.custom.filter(c => c.id!==editing);
  S.favs = S.favs.filter(x => x!==editing);
  save(); render(); closeSheets(); toast("Deleted");
};

$("#gPlayed").onclick = () => { markPlayed(current.id, !isPlayed(current.id)); closeSheets(); };
$("#gFav").onclick = () => { const id=current.id; S.favs = S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id]; save(); render(); closeSheets(); };
$("#gShare").onclick = () => shareText(current.name, current.url);
$("#gEdit").onclick = () => openEdit(current);
$("#gHide").onclick = () => {
  const id=current.id;
  if (S.hidden.includes(id)){ S.hidden = S.hidden.filter(x=>x!==id); toast("Unhidden"); }
  else { S.hidden.push(id); toast(`Hidden ${current.name} · undo in Settings`); }
  save(); render(); closeSheets();
};

$("#mTheme").onclick = () => { S.theme = {auto:"light",light:"dark",dark:"auto"}[S.theme]; save(); applyTheme(); };
$("#mDoneLast").onclick = () => { S.doneLast = !S.doneLast; save(); applyTheme(); render(); };
$("#mReset").onclick = () => { if (confirm("Clear today's played games?")){ S.played.ids=[]; delete S.history[S.played.date]; save(); render(); closeSheets(); toast("Today reset"); } };
$("#mHidden").onclick = () => { S.showHidden = !S.showHidden; render(); closeSheets(); toast(S.showHidden ? "Showing hidden games (dashed). Tap ⋯ → Unhide" : "Hidden games hidden again"); };
$("#mShareList").onclick = () => {
  if (!S.custom.length){ toast("Add some games first with +"); return; }
  const list = S.custom.map(({name,url,emoji,tag}) => ({name,url,emoji,tag}));
  shareText("My daily games", baseUrl()+"?import="+b64e(list));
};
$("#mExport").onclick = () => {
  const data = {app:"daily-dash", v:1, custom:S.custom, edits:S.edits, hidden:S.hidden, favs:S.favs, history:S.history};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `daily-dash-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
};
$("#mImport").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const d = JSON.parse(await f.text());
    const n = addCustom(d.custom||[]);
    if (d.edits && typeof d.edits==="object") S.edits = {...S.edits, ...d.edits};
    if (Array.isArray(d.hidden)) S.hidden = [...new Set([...S.hidden, ...d.hidden])];
    if (Array.isArray(d.favs)) S.favs = [...new Set([...S.favs, ...d.favs])];
    if (d.history && typeof d.history==="object") S.history = {...d.history, ...S.history};
    save(); render(); closeSheets(); toast(`Imported ✓ (${n} new game${n===1?"":"s"})`);
  }catch{ toast("Couldn't read that file"); }
  e.target.value = "";
};
$("#mInstall").onclick = () => { closeSheets(); $("#installTip").classList.add("on"); window.scrollTo({top:0,behavior:"smooth"}); };

// Install tip (iOS Safari, not yet installed)
const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && !LS.get("tipDismissed", false)) $("#installTip").classList.add("on");
$("#installClose").onclick = () => { $("#installTip").classList.remove("on"); LS.set("tipDismissed", true); };

// Refresh when coming back to the app (e.g. after playing a game in another tab, or next morning)
document.addEventListener("visibilitychange", () => { if (!document.hidden){ rollDay(); render(); tickClock(); } });
window.addEventListener("pageshow", () => { rollDay(); render(); });
window.addEventListener("storage", () => { Object.assign(S, {custom:LS.get("custom",[]),edits:LS.get("edits",{}),hidden:LS.get("hidden",[]),favs:LS.get("favs",[]),played:LS.get("played",S.played),history:LS.get("history",{})}); render(); });

/* ---------- Boot ---------- */
applyTheme(); rollDay(); render(); tickClock(); setInterval(tickClock, 1000); handleUrlParams();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
